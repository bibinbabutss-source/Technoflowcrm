{% extends "base.html" %}
{% block title %}Delete {{ object }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px"><div class="card-body">
  <h1 class="h2">Delete {{ object }}?</h1>
  <p class="text-secondary">This cannot be undone. The deletion is recorded in the audit log.</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger" type="submit">Delete</button>
    <a class="btn btn-outline-secondary" href="{{ object.get_absolute_url }}">Cancel</a>
  </form>
</div></div>
{% endblock %}

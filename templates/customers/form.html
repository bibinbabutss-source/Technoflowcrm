{% extends "crud/form.html" %}
{% block form_top %}
{% if form.duplicates %}
<div class="alert alert-warning">
  <strong>Possible duplicates</strong>
  <ul class="mb-0 mt-1">{% for d in form.duplicates %}<li><a href="{{ d.customer.get_absolute_url }}" target="_blank" rel="noopener">{{ d.customer }}</a> — {{ d.reasons|join:", " }}</li>{% endfor %}</ul>
</div>
{% endif %}
{% endblock %}

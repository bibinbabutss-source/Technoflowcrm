# Nginx site for Technoflow CRM on your own Linux server (Ubuntu 24.04).
# Copy to /etc/nginx/sites-available/technoflow-crm, link into sites-enabled, then:
#   sudo certbot --nginx -d crm.technoflow.com     (free HTTPS certificate)
#   sudo nginx -t && sudo systemctl reload nginx
# Replace crm.technoflow.com with your address.

upstream technoflow_crm {
    server unix:/run/technoflow-crm/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name crm.technoflow.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm.technoflow.com;
    # certbot fills in ssl_certificate / ssl_certificate_key

    client_max_body_size 25m;            # keep above MAX_UPLOAD_MB
    server_tokens off;

    # Static files (CSS, JS, logo) collected by "manage.py collectstatic"
    location /static/ {
        alias /srv/technoflow_crm/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Uploaded documents are PRIVATE: never served by Nginx. Downloads go through the CRM,
    # which checks permissions. There is deliberately no "location /media/".

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 90s;
        proxy_pass http://technoflow_crm;
    }
}
